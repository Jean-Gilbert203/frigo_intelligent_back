spring.application.name=frigo
# Port du serveur
server.port=8082

# Connexion à la base 
spring.datasource.url=jdbc:mariadb://localhost:3307/frigo_intelligent
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Indian/Antananarivo

# Origines autorisées pour le WebSocket (* seulement en développement)
frigo.websocket.origines=*

# Origines autorisées pour les appels à l'API (* seulement en développement)
frigo.cors.origines=*

# Affiche les requêtes SQL dans la console 
spring.jpa.show-sql=true

# Nombre de jours avant la péremption à partir duquel un lot est « bientôt périmé »
frigo.alerte-peremption-jours=3

# Délai avant l'alerte de porte ouverte, en secondes
frigo.delai-alerte-porte-secondes=60

# Surveillance quotidienne : secondes, minutes, heures, jour, mois, jour de la semaine (ici 7 h 00)
frigo.surveillance.cron=0 0 7 * * *

# Rappel de courses : rayon de déclenchement et rayon de réarmement, en mètres
frigo.rayon-rappel-metres=500
frigo.rayon-rearmement-metres=600